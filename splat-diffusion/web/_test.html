<!doctype html><meta charset="utf-8"><title>splat-diffusion test</title>
<p>Test harness for splatdiff.js, driven by <code>run/test_gpu.mjs</code>: loads the fixtures in <code>test/</code>
(made by <code>train/export.py fixture</code>), compares the GPU output with PyTorch, and prints the result.</p>
<script type="module">
import { SplatDiffusion, paintToBytes } from "./splatdiff.js";
window.runTests = async () => {
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice({ requiredLimits: {
    maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize } });
  const errs = [];
  device.addEventListener("uncapturederror", (e) => errs.push(e.error.message));
  const m = await SplatDiffusion.create(device, "./test");
  const cases = await (await fetch("./test/cases.json")).json();
  const res = [];
  for (const c of cases) {
    let got, want;
    if (c.kind === "forward") { got = await m.forward(new Float32Array(c.x), c.t, c.y); want = c.v; }
    else {
      await m.sample({ cls: c.y, steps: c.steps, cfg: c.cfg, noise: new Float32Array(c.noise) });
      got = await m.read(m.b.S, m.K * 10); want = c.out;
    }
    let maxd = 0, maxw = 0;
    for (let i = 0; i < want.length; i++) { maxd = Math.max(maxd, Math.abs(got[i] - want[i])); maxw = Math.max(maxw, Math.abs(want[i])); }
    res.push({ kind: c.kind, rel: maxd / maxw, maxd, nan: got.some(Number.isNaN) });
    if (c.splats) {
      const sp = await m.splats();
      let md = 0;
      for (let i = 0; i < c.splats.length; i++) {
        let dd = Math.abs(sp[i] - c.splats[i]);
        if (i % 8 < 2) dd = Math.min(dd, 1 - dd);        // positions live on the torus
        md = Math.max(md, dd / Math.max(1, Math.abs(c.splats[i])));
      }
      res.push({ kind: "decode", rel: md, nan: Array.from(sp).some(Number.isNaN) });
      const px = await paintToBytes(device, m.b.splats, m.K, 64);
      let pd = 0, n = 0, sum = 0;
      for (let i = 0; i < 64 * 64; i++) for (let ch = 0; ch < 3; ch++) {
        const dd = Math.abs(px[4 * i + ch] - c.paint64[3 * i + ch]); pd = Math.max(pd, dd); sum += dd; n++;
      }
      res.push({ kind: "paint (8-bit levels)", rel: pd, mean: sum / n, nan: false });
    }
  }
  return { res, errs };
};
window.ready = true;
</script>
