<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI List Map</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --panel: #ffffff; --line: #dedcd6;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #7a7972;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --point: #a9a7a0; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --panel: #222220; --line: #383835;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #8f8e86;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --point: #5c5b56; --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --panel: #222220; --line: #383835;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #8f8e86;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --point: #5c5b56; --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface-1); color: var(--text-primary); font: 14px/1.45 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  .muted { color: var(--text-secondary); font-size: 13px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .seg button { border: 1px solid var(--line); background: transparent; color: var(--text-primary); padding: 5px 10px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  label.lbl { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 12px; }
  input[type=range] { width: 100%; }
  select, input[type=search] { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); font: inherit; }
  #topics { list-style: none; padding: 0; margin: 6px 0 0; }
  #topics li { display: flex; gap: 8px; align-items: baseline; padding: 4px 4px; border-radius: 5px; cursor: pointer; font-size: 13px; }
  #topics li:hover { background: var(--surface-1); }
  #topics .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--point); align-self: center; }
  #topics .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #topics li[aria-selected="true"] { font-weight: 600; }
  main { position: relative; }
  #deck { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; top: 10px; font-size: 13px; color: var(--text-secondary); pointer-events: none; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; max-width: 320px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #post { position: absolute; right: 12px; bottom: 12px; width: min(380px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: none; }
  #post .text { white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
  #post a { color: var(--accent); }
  #share { width: 100%; height: 120px; display: block; margin-top: 6px; }
  #share text { fill: var(--text-secondary); font-size: 10px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; } aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>The AI list, mapped</h1>
    <div class="muted" id="summary">Loading…</div>

    <div class="row seg" id="view">
      <button data-v="2d" aria-pressed="true">2D</button>
      <button data-v="3d" aria-pressed="false">3D</button>
    </div>

    <label class="lbl">Colour</label>
    <div class="row seg" id="colour">
      <button data-c="topics" aria-pressed="true">Topics</button>
      <button data-c="age" aria-pressed="false">Post age</button>
      <button data-c="author" aria-pressed="false">Author</button>
    </div>
    <select id="author" hidden></select>
    <div id="agekey" hidden class="muted" style="font-size:12px">
      <div id="agebar" style="height:8px;border-radius:4px;margin:4px 0"></div>
      <div style="display:flex;justify-content:space-between"><span id="age0"></span><span id="age1"></span></div>
    </div>

    <label class="lbl">Time window <span id="when"></span></label>
    <input type="range" id="tend" min="0" max="1000" value="1000" aria-label="window end">
    <div class="row">
      <select id="twidth" aria-label="window width" style="width:auto">
        <option value="7">1 week</option><option value="30">1 month</option>
        <option value="90">3 months</option><option value="0" selected>everything</option>
      </select>
      <div class="seg"><button id="play" aria-pressed="false">▶ Play</button></div>
    </div>

    <label class="lbl">Topic share of posts per month (pick up to 3 topics)</label>
    <svg id="share" role="img" aria-label="share of posts per month for the selected topics"></svg>

    <label class="lbl">Topics</label>
    <ul id="topics"></ul>
    <p class="note" id="bias"></p>
  </aside>
  <main>
    <div id="deck"></div>
    <div id="hud"></div>
    <div id="tip"></div>
    <div id="post"></div>
  </main>
</div>
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<script type="module" src="map.js"></script>
</body>
</html>
