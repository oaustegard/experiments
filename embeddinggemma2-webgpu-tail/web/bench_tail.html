<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>remex tail on WebGPU: bench</title>
<link rel="icon" href="data:,">
</head>
<body>
<p>Times the WebGPU tail at the sizes of <code>run/native_bench.py</code>: encode (tiled and the
untiled kernel it replaced), a scan of 100k codes &times; 20 queries, and top-10 on the GPU and on the
host. Takes a few seconds on a real GPU. Parameters: <code>?n=100000&amp;n_enc=16384&amp;reps=3</code>.</p>
<p><button id="run" disabled>Run bench</button> <button id="copy" disabled>Copy JSON</button></p>
<pre id="log">loading</pre>
<pre id="out"></pre>
<script type="module">
// Tail-only timings at the sizes of run/native_bench.py: encode, scan of 100k x 20 queries, top-10
// on the GPU and on the host. ?untiled=<module url> also times that module's encode (the one-vector
// kernel kept in out/tail_untiled.js by the round-3 run). Rows are random: no kernel's cost depends
// on the values. Every timing waits for queue.onSubmittedWorkDone.
import { RemexTail } from './tail.js';

const D = 768;
const Q = new URLSearchParams(location.search);
const N = Number(Q.get('n') || 100000);
const N_ENC = Number(Q.get('n_enc') || 16384);
const NQ = 20, K = 10;
const REPS = Number(Q.get('reps') || 3);
const UNTILED = Q.get('untiled') ?? './tail_untiled.js';   // ?untiled= (empty) skips it
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

async function time(fn, reps, device) {
  await fn(); await device.queue.onSubmittedWorkDone();       // warm-up
  const runs = [];
  for (let r = 0; r < reps; r++) {
    const t0 = performance.now();
    await fn();
    await device.queue.onSubmittedWorkDone();
    runs.push(+(performance.now() - t0).toFixed(1));
  }
  return { median: median(runs), runs };
}

async function runBench() {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice({
    requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize },
  });
  const errors = [];
  device.addEventListener('uncapturederror', (e) => errors.push(e.error.message));
  const info = adapter.info ?? {};
  const P = await (await fetch('assets/params.json')).json();
  const R = new Float32Array(await (await fetch('assets/R.f32.txt')).arrayBuffer());
  const params = { R, mu: new Float32Array(D), boundaries: P.boundaries, centroids: P.centroids, kappa: P.kappa };
  const tail = await RemexTail.create(device, params);

  const rng = mulberry32(1);
  const X = new Float32Array(N * D);
  for (let i = 0; i < X.length; i++) X[i] = rng() * 2 - 1;
  const xbuf = device.createBuffer({ size: X.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(xbuf, 0, X);
  const qbuf = device.createBuffer({ size: NQ * D * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(qbuf, 0, X.subarray(0, NQ * D));
  await device.queue.onSubmittedWorkDone();

  const out = { adapter: { vendor: info.vendor, architecture: info.architecture, device: info.device,
                           description: info.description },
                user_agent: navigator.userAgent, when: new Date().toISOString(),
                n: N, n_enc: N_ENC, nq: NQ, k: K, reps: REPS };
  const small = tail.allocCorpus(N_ENC);
  out.encode_tiled_ms = await time(() => tail.encode(xbuf, N_ENC, small, 0), REPS, device);
  log(`encode tiled ${N_ENC}: ${out.encode_tiled_ms.median} ms`);
  if (UNTILED) {
    const { RemexTail: Old } = await import(new URL(UNTILED, location.href).href);
    const old = await Old.create(device, params);
    out.encode_untiled_ms = await time(() => old.encode(xbuf, N_ENC, small, 0), REPS, device);
    log(`encode untiled ${N_ENC}: ${out.encode_untiled_ms.median} ms`);
  }
  small.words.destroy(); small.aux.destroy();

  const corpus = tail.allocCorpus(N);
  let t0 = performance.now();
  tail.encode(xbuf, N, corpus, 0);
  await device.queue.onSubmittedWorkDone();
  out.encode_full_ms = +(performance.now() - t0).toFixed(1);
  log(`encode tiled ${N}: ${out.encode_full_ms} ms`);

  out.scan_ms = await time(() => { tail.search(qbuf, NQ, corpus).destroy(); }, REPS, device);
  log(`scan ${N} x ${NQ}: ${out.scan_ms.median} ms`);
  out.topk_gpu_ms = await time(() => tail.topk(qbuf, NQ, corpus, N, K), REPS, device);
  log(`search + GPU top-${K}: ${out.topk_gpu_ms.median} ms`);
  out.topk_host_ms = await time(() => tail.topkHost(qbuf, NQ, corpus, N, K), REPS, device);
  log(`search + readback + host top-${K}: ${out.topk_host_ms.median} ms`);
  out.errors = errors;
  return out;
}
window.runBench = runBench;
window.benchReady = true;

const runBtn = document.getElementById('run');
const copyBtn = document.getElementById('copy');
const outEl = document.getElementById('out');
if (!navigator.gpu) log('navigator.gpu is missing: this browser has no WebGPU (or the page is not on https / localhost).');
else { runBtn.disabled = false; log('ready'); }
runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  try {
    const r = await runBench();
    outEl.textContent = JSON.stringify(r, null, 1);
    copyBtn.disabled = false;
  } catch (e) {
    log('ERROR: ' + (e?.stack ?? e));
  } finally {
    runBtn.disabled = false;
  }
});
copyBtn.addEventListener('click', () => navigator.clipboard.writeText(outEl.textContent));
</script>
</body>
</html>
