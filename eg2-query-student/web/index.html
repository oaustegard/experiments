<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG2 Target Build</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6b6861; --line: #d9d5cc; --panel: #ffffff;
    --ok: #1f6f3f; --ok-bg: #e7f4ec; --bad: #9b2a1c; --bad-bg: #fbe9e6; --accent: #2f5fa7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --fg: #ecebe6; --muted: #a09d95; --line: #3a3935; --panel: #1f1e1b;
      --ok: #7fd39a; --ok-bg: #173223; --bad: #ff9a8a; --bad-bg: #3a1d18; --accent: #8ab4f0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --fg: #ecebe6; --muted: #a09d95; --line: #3a3935; --panel: #1f1e1b;
    --ok: #7fd39a; --ok-bg: #173223; --bad: #ff9a8a; --bad-bg: #3a1d18; --accent: #8ab4f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
  button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); }
  .status { padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line); margin-top: 10px; font-size: 14px; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.bad { background: var(--bad-bg); color: var(--bad); }
  progress { width: 100%; height: 14px; margin-top: 10px; }
  ul.files { padding-left: 18px; margin: 8px 0 0; }
  ul.files a { color: var(--accent); }
  pre { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; color: var(--muted); max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<main>
  <h1>EG2 training targets</h1>
  <p class="muted">Embeds query-shaped texts with EmbeddingGemma 2 (q4, WebGPU) for the
    <a href="https://github.com/oaustegard/experiments/issues/102">eg2-query-student</a> experiment.
    Post text is fetched from Bluesky in this page and never leaves it; only vectors are saved.</p>
  <section>
    <button id="run" disabled>Run</button>
    <button id="copy" class="ghost" disabled>Copy JSON</button>
    <div id="status" class="status">Loading model…</div>
    <progress id="bar" value="0" max="1"></progress>
    <ul id="files" class="files"></ul>
  </section>
  <section>
    <strong>Log</strong>
    <pre id="log"></pre>
  </section>
</main>
<script type="module" src="embed.js"></script>
</body>
</html>
