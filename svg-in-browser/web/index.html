<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to SVG in the browser</title>
<style>
  :root { --bg: #f6f5f1; --fg: #1d1d1b; --muted: #6b6a64; --line: #d9d7cf; --accent: #2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --muted: #9a9890; --line: #33322e; --accent: #6aa8f0; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
  label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button { cursor: pointer; border-color: var(--accent); color: var(--accent); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .panes { grid-template-columns: 1fr; } }
  figure { margin: 0; }
  figure img, figure .svg { width: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  figure .svg svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
  pre { font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Image to SVG in the browser</h1>
  <p>k-means on the GPU (WGSL) when WebGPU is available, plain JavaScript otherwise; tracing and output in JavaScript. Nothing is uploaded.</p>
  <div class="controls">
    <label>Image <input type="file" id="file" accept="image/*"></label>
    <label>Colors (K) <input type="number" id="k" value="56" min="2" max="256"></label>
    <label>Max side (px) <input type="number" id="side" value="1000" min="100" max="4000" step="100"></label>
    <label>Coordinates <select id="precision"><option value="1">0.1 unit</option><option value="0">whole units</option></select></label>
    <label>Backend <select id="backend"><option value="auto">auto</option><option value="js">JavaScript</option></select></label>
    <button id="run">Convert</button>
  </div>
  <div class="panes">
    <figure><img id="src" alt="Source image"><figcaption>Source</figcaption></figure>
    <figure><div class="svg" id="out"></div><figcaption id="cap">SVG</figcaption></figure>
  </div>
  <pre id="log"></pre>
</main>
<script type="module">
import { imageToSvg } from "./trace.js";
const $ = (id) => document.getElementById(id);
let device = null;
async function getDevice() {
  if (device !== null || !navigator.gpu) return device;
  const adapter = await navigator.gpu.requestAdapter();
  device = adapter ? await adapter.requestDevice() : null;
  return device;
}
async function load(url) {
  const img = $("src");
  img.src = url;
  await img.decode();
}
function pixels(img, side) {
  const s = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
  const c = new OffscreenCanvas(Math.round(img.naturalWidth * s), Math.round(img.naturalHeight * s));
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return ctx.getImageData(0, 0, c.width, c.height);
}
async function run() {
  $("log").textContent = "working…";
  const dev = $("backend").value === "js" ? null : await getDevice();
  const { svg, stats } = await imageToSvg(pixels($("src"), +$("side").value), {
    K: +$("k").value, precision: +$("precision").value, device: dev,
  });
  $("out").innerHTML = svg;
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  $("cap").innerHTML = `SVG · ${(stats.bytes / 1024).toFixed(0)} KB · ${stats.backend} · <a download="trace.svg" href="${url}">download</a>`;
  $("log").textContent = JSON.stringify(stats, null, 1);
  window.lastResult = { svg, stats };
}
$("file").onchange = async (e) => { if (e.target.files[0]) { await load(URL.createObjectURL(e.target.files[0])); run(); } };
$("run").onclick = run;
window.imageToSvg = imageToSvg; window.getDevice = getDevice; window.pixels = pixels;
await load("starry.jpg");
if (!new URLSearchParams(location.search).has("manual")) run();
</script>
</body>
</html>
