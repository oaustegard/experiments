<!doctype html>
<meta charset="utf-8">
<title>eg2-layer-student smoke</title>
<script type="module">
// Runs a shipped student (?file=, default model_q4.onnx, + its _data) in onnxruntime-web on the
// given execution provider for pre-tokenized ids, and leaves the vectors on window.result.
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/';
const q = new URLSearchParams(location.search);
const base = q.get('model'), ep = q.get('ep') || 'wasm', file = q.get('file') || 'model_q4.onnx';
window.result = { phase: 'loading' };
try {
  const ort = await import(ORT + 'ort.webgpu.min.mjs');
  ort.env.wasm.wasmPaths = ORT;
  const fetchBuf = async u => new Uint8Array(await (await fetch(u)).arrayBuffer());
  const [graph, data, ids] = await Promise.all([
    fetchBuf(base + file), fetchBuf(base + file + '_data'),
    (await fetch(q.get('ids'))).json()]);
  const sess = await ort.InferenceSession.create(graph, {
    executionProviders: [ep], externalData: [{ path: file + '_data', data }] });
  const out = [];
  for (const row of ids) {
    const n = row.length;
    const feeds = {
      input_ids: new ort.Tensor('int64', BigInt64Array.from(row.map(BigInt)), [1, n]),
      attention_mask: new ort.Tensor('int64', new BigInt64Array(n).fill(1n), [1, n]) };
    const r = await sess.run(feeds);
    out.push(Array.from(r.embedding.data));
  }
  window.result = { phase: 'done', ep, vectors: out };
} catch (e) {
  window.result = { phase: 'error', error: String(e && e.stack || e) };
}
</script>
