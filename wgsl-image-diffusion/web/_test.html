<!doctype html><meta charset="utf-8"><title>wgsl-image-diffusion test</title>
<p>Test harness for diffusion.js, driven by <code>run/test_gpu.mjs</code>: it loads the fixtures in <code>test/</code> (made by <code>train/export.py fixture</code>), compares each GPU output with PyTorch, and prints the result to the terminal.</p>
<script type="module">
import { ImageDiffusion } from "./diffusion.js";
window.runTests = async (only) => {
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice({ requiredLimits: {
    maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
    maxBufferSize: adapter.limits.maxBufferSize } });
  const errs = [];
  device.addEventListener("uncapturederror", (e) => errs.push(e.error.message));
  const cases = await (await fetch("./test/cases.json")).json();
  const res = [];
  const variants = [["f32", { act: "f32" }], ["f32-nosplit", { act: "f32", splitTarget: 0 }],
                    ["f16", { act: "f16" }], ["f16-nosplit", { act: "f16", splitTarget: 0 }]];
  for (const [vname, vopts] of variants) {
    if (only && !only.includes(vname)) continue;
    const m = await ImageDiffusion.create(device, "./test", vopts);
    for (const c of cases) {
      const t0 = performance.now();
      let got, want;
      if (c.kind === "forward") {
        got = await m.forward(new Float32Array(c.x), c.t, c.y, c.H, c.W);
        want = c.v;
      } else {
        await m.sample({ cls: c.y, H: c.H, W: c.W, steps: c.steps, cfg: c.cfg, noise: new Float32Array(c.noise) });
        got = (await m.read(m.dBuf, 3 * c.H * c.W)).map((v) => Math.max(-1, Math.min(1, v)));
        want = c.out;
      }
      let maxd = 0, maxw = 0;
      for (let i = 0; i < want.length; i++) { maxd = Math.max(maxd, Math.abs(got[i] - want[i])); maxw = Math.max(maxw, Math.abs(want[i])); }
      res.push({ v: vname, kind: c.kind, H: c.H, W: c.W, maxd, maxw, rel: maxd / maxw, ms: Math.round(performance.now() - t0), nan: got.some(Number.isNaN) });
    }
    m.freePlan();
  }
  return { res, errs };
};
window.ready = true;
</script>
