<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="out"></canvas><script type="module">
// Hero image for the hand-written TRM post, drawn by a WGSL fragment shader from the network's own state
// (state.json: wavefront labels mod 3, route marks, BFS distance for shading). Renders offscreen, reads back,
// and leaves a PNG data URL in window.RESULT.
const W = +(new URLSearchParams(location.search).get("w") || 1600), H = +(new URLSearchParams(location.search).get("h") || 840);
try {
  const st = await (await fetch("state.json")).json();
  const dev = await (await navigator.gpu.requestAdapter()).requestDevice();
  const n = st.n, cells = new Uint32Array(n * n);
  for (let k = 0; k < n * n; k++) cells[k] = st.tok[k] | ((st.lab[k] + 1) << 4) | (st.mark[k] << 8) | (Math.max(0, st.dist[k]) << 12);
  const buf = dev.createBuffer({ size: cells.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  dev.queue.writeBuffer(buf, 0, cells);
  const uni = dev.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  let x0 = n, x1 = 0, y0 = n, y1 = 0;
  for (let k = 0; k < n * n; k++) if (st.mark[k]) { const i = k % n, j = (k / n) | 0; x0 = Math.min(x0, i); x1 = Math.max(x1, i); y0 = Math.min(y0, j); y1 = Math.max(y1, j); }
  const span = Math.max(x1 - x0 + 1, (y1 - y0 + 1) * W / H) * 1.55; // grid cells across the image width
  dev.queue.writeBuffer(uni, 0, new Float32Array([W, H, n, st.dmax, (x0 + x1 + 1) / 2, (y0 + y1 + 1) / 2, span, 0, ...[5, 6].flatMap((t) => { const k = st.tok.indexOf(t); return [k % n + 0.5, ((k / n) | 0) + 0.5]; })]));
  const code = /* wgsl */`
struct U { res: vec2f, n: f32, dmax: f32, centre: vec2f, span: f32, pad: f32, startp: vec2f, goalp: vec2f };
@group(0) @binding(0) var<storage, read> cells: array<u32>;
@group(0) @binding(1) var<uniform> u: U;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = array(vec2f(-1, -3), vec2f(-1, 1), vec2f(3, 1));
  return vec4f(p[i], 0, 1);
}

fn cell(i: i32, j: i32) -> u32 {
  let n = i32(u.n);
  if (i < 0 || j < 0 || i >= n || j >= n) { return 0u; } // outside = padding
  return cells[u32(j * n + i)];
}
fn tok(c: u32) -> u32 { return c & 15u; }
fn lab(c: u32) -> i32 { return i32((c >> 4u) & 15u) - 1; }
fn mark(c: u32) -> f32 { return f32((c >> 8u) & 1u); }
fn dist(c: u32) -> f32 { return f32(c >> 12u); }

fn hash(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453); }

// pixel -> grid coordinates: centred on the route, rotated a little; w = distance from centre for falloff
fn ground(px: vec2f) -> vec3f {
  let s = (px - 0.5 * u.res) / u.res.x * u.span;
  let ang = -1.32;
  let q = vec2f(s.x * cos(ang) - s.y * sin(ang), s.x * sin(ang) + s.y * cos(ang));
  return vec3f(q + u.centre, length(s) / u.span);
}

fn shade(px: vec2f) -> vec3f {
  let gp = ground(px);
  let g = gp.xy;
  let ci = vec2i(floor(g));
  let f = fract(g);
  let c = cell(ci.x, ci.y);
  let tk = tok(c);
  var col = vec3f(0.012, 0.014, 0.02);
  let pal = array(vec3f(0.05, 0.42, 0.55), vec3f(0.22, 0.16, 0.58), vec3f(0.48, 0.10, 0.42));
  let edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  if (tk >= 2u) {
    let l = lab(c);
    if (l >= 0) {
      // the goal's wavefront: hue drifts teal -> violet with distance, ripples every six steps
      let d = dist(c) / u.dmax;
      let ph = fract((dist(c) + f.x * 0.0) / 6.0);
      let ripple = 0.25 + 0.75 * smoothstep(0.0, 0.3, ph) * smoothstep(1.0, 0.6, ph);
      let hue = mix(vec3f(0.02, 0.50, 0.62), vec3f(0.38, 0.10, 0.62), smoothstep(0.0, 1.0, d));
      col = hue * ripple * (0.22 + 0.78 * pow(1.0 - d, 1.3));
      // the three mod-3 labels as a faint stipple, so the code the network keeps is still visible
      let dotp = smoothstep(0.16, 0.08, length(f - 0.5));
      col += pal[l] * dotp * 0.25 * (1.0 - d);
    } else {
      col = vec3f(0.005, 0.005, 0.007); // open floor the wave never reached
    }
    if (tk == 4u) { col = mix(col, vec3f(0.10, 0.28, 0.04), 0.35); } // damaging floor
    col *= 0.7 + 0.3 * smoothstep(0.0, 0.08, edge); // cell grout
  } else {
    col = vec3f(0.0008, 0.0008, 0.0016) * (1.0 + hash(vec2f(ci)));
  }
  // route bloom: gaussian sum over route cells nearby
  var glow = 0.0;
  for (var dj = -4; dj <= 4; dj++) {
    for (var di = -4; di <= 4; di++) {
      let o = cell(ci.x + di, ci.y + dj);
      if (mark(o) > 0.0) {
        let v = g - (vec2f(ci + vec2i(di, dj)) + 0.5);
        glow += exp(-dot(v, v) * 0.55);
      }
    }
  }
  let core = mark(c) * smoothstep(0.5, 0.18, max(abs(f.x - 0.5), abs(f.y - 0.5)));
  col += vec3f(1.0, 0.42, 0.06) * glow * 0.075 + vec3f(1.0, 0.62, 0.22) * core * 0.42;
  // start (green) and goal (red-white) beacons, drawn over several cells
  let pts = array(u.startp, u.goalp);
  for (var k = 0; k < 2; k++) {
    let v = g - pts[k];
    let r = length(v);
    let hue = select(vec3f(0.25, 1.0, 0.45), vec3f(1.0, 0.22, 0.15), k == 1);
    col += hue * (exp(-r * r * 1.2) * 2.2 + smoothstep(0.25, 0.0, abs(r - 2.2)) * 0.6 + smoothstep(0.2, 0.0, abs(r - 3.6)) * 0.3);
  }
  // fog into the distance, and outside the plane
  let fog = smoothstep(0.42, 0.75, gp.z);
  col = mix(col, vec3f(0.0, 0.0, 0.0), fog);
  return col;
}

@fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
  // slight chromatic aberration away from centre
  let off = (p.xy / u.res - 0.5) * 2.2;
  var col = vec3f(shade(p.xy + off).r, shade(p.xy).g, shade(p.xy - off).b);
  // filmic tone map, vignette, scanlines, grain
  col = col / (col + vec3f(0.7)) * 1.7;
  let v = p.xy / u.res - 0.5;
  col *= 1.0 - dot(v, v) * 1.1;
  col *= 0.96 + 0.04 * sin(p.y * 3.14159);
  col += (hash(p.xy) - 0.5) * 0.006;
  return vec4f(pow(clamp(col, vec3f(0), vec3f(1)), vec3f(1.0 / 2.2)), 1.0);
}`;
  const mod = dev.createShaderModule({ code });
  const info = await mod.getCompilationInfo();
  if (info.messages.some((m) => m.type === "error")) throw new Error(info.messages.map((m) => `${m.lineNum}:${m.linePos} ${m.message}`).join("\n"));
  const pl = dev.createRenderPipeline({ layout: "auto", vertex: { module: mod, entryPoint: "vs" }, fragment: { module: mod, entryPoint: "fs", targets: [{ format: "rgba8unorm" }] } });
  const bg = dev.createBindGroup({ layout: pl.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: buf } }, { binding: 1, resource: { buffer: uni } }] });
  const tex = dev.createTexture({ size: [W, H], format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const bpr = Math.ceil(W * 4 / 256) * 256;
  const rb = dev.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = dev.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pl); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
  enc.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: bpr }, [W, H]);
  dev.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);
  const src = new Uint8Array(rb.getMappedRange()), img = new ImageData(W, H);
  for (let y = 0; y < H; y++) img.data.set(src.subarray(y * bpr, y * bpr + W * 4), y * W * 4);
  const cv = document.getElementById("out"); cv.width = W; cv.height = H; cv.getContext("2d").putImageData(img, 0, 0);
  window.RESULT = { png: cv.toDataURL("image/png") };
} catch (e) { window.RESULT = { error: String(e.stack || e) }; }
</script>
