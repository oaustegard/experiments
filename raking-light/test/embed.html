<!doctype html><html><head><meta charset="utf-8"><title>embed test</title>
<script type="module" src="../web/raking-light.js"></script>
<style>body{margin:0;padding:20px;background:#2a6f6b;display:grid;grid-template-columns:repeat(3,300px);gap:24px;font-family:sans-serif}</style></head><body>
<raking-light id="a" preset="golden hour" style="width:300px" aria-label="Badge">
  <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="#f4c95d"/><circle cx="100" cy="100" r="70" fill="none" stroke="#1f3a5f" stroke-width="8"/><text x="100" y="118" text-anchor="middle" font-family="Georgia" font-size="56" font-weight="700" fill="#1f3a5f">A&nbsp;1</text></svg>
</raking-light>
<raking-light id="b" src="sample.svg" preset="raking" material="enamel" light="fixed" style="width:300px"></raking-light>
<raking-light id="c" preset="studio" wall="#22252b" light="orbit" style="width:300px">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120"><rect width="300" height="120" rx="20" fill="#e9e4d8"/><text x="150" y="80" text-anchor="middle" font-family="Helvetica" font-weight="800" font-size="56" fill="#d6452e">HELLO</text></svg>
</raking-light>
</body></html>
