<!doctype html><meta charset="utf-8"><title>splat collage GPU check</title>
<script type="module">
// Renders one scene three ways and compares: the page's storage-buffer shader, the baked standalone
// shader, and evalCPU. Scene: a synthetic 4-region picture (two discs, a band, background) with bank
// textures, so the check needs no segmentation.
import * as S from "../splatcollage.js";
import { labStats, rgbToLab } from "../../web/collage.js";
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const bank = new Float32Array(await (await fetch("../bank.bin")).arrayBuffer());
const meta = await (await fetch("../bank_meta.json")).json();

function scene(mode, NR = 4) {
  const W = 192, H = 128, labels = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let k = 0;
    if ((x - 60) ** 2 + (y - 60) ** 2 < 900) k = 1; else if ((x - 140) ** 2 + (y - 70) ** 2 < 1300) k = 2; else if (Math.abs(x - y - 20) < 10) k = 3;
    labels[y * W + x] = k % NR;
  }
  const stats = [{ mean: [60, 20, 30], std: [10, 4, 4] }, { mean: [40, -20, 30], std: [6, 3, 3] }, { mean: [75, 5, -30], std: [12, 2, 5] }, { mean: [30, 0, 0], std: [5, 1, 1] }];
  const seg = { W, H, K: NR, labels };
  const cls = [23, 42, 18, 44];
  const regions = cls.slice(0, NR).map((c, k) => ({ splats: S.recolourSplats(bank.subarray(c * 512 * 12, (c + 1) * 512 * 12), 512, meta.classes[c].stats, stats[k]),
    phi: 0.3 * k, scale: 1 + (k % 2), off: [0.1 * k, 0.2 * k] }));
  return S.makeScene({ W0: W, H0: H, lm: S.labelMap(seg, 48), regions, K: 512, mode, blend: 0 });
}

async function renderGPU(code, bindings, uni, W, H) {
  const mod = device.createShaderModule({ code });
  const info = await mod.getCompilationInfo();
  const errs = info.messages.filter((m) => m.type === "error");
  if (errs.length) throw new Error(errs.map((m) => `${m.lineNum}:${m.message}`).join("\n"));
  const pipe = device.createRenderPipeline({ layout: "auto", vertex: { module: mod, entryPoint: "vs" }, fragment: { module: mod, entryPoint: "fs", targets: [{ format: "rgba8unorm" }] } });
  const ub = device.createBuffer({ size: uni.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(ub, 0, uni);
  const entries = [{ binding: 0, resource: { buffer: ub } }];
  bindings.forEach((arr, i) => { const b = device.createBuffer({ size: arr.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(b, 0, arr); entries.push({ binding: i + 1, resource: { buffer: b } }); });
  const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries });
  const tex = device.createTexture({ size: [W, H], format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const bpr = Math.ceil(W * 4 / 256) * 256, rb = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
  enc.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: bpr }, [W, H]);
  device.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);
  const src = new Uint8Array(rb.getMappedRange()), out = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) out.set(src.subarray(y * bpr, y * bpr + W * 4), y * W * 4);
  rb.unmap();
  return out;
}

const VIEW = `
struct V { x0: f32, y0: f32, scale: f32, _p: f32 }
@group(0) @binding(0) var<uniform> view: V;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let xy = vec2f(f32((i << 1u) & 2u), f32(i & 2u)); return vec4f(xy * 2.0 - 1.0, 0.0, 1.0); }
@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  return vec4f(collage(vec2f(view.x0, view.y0) + pos.xy * view.scale, view.scale), 1.0); }`;

function compare(a, b, n) {
  let se = 0, mx = 0;
  for (let i = 0; i < n; i++) for (let c = 0; c < 3; c++) { const d = a[4 * i + c] - b[4 * i + c]; se += d * d; mx = Math.max(mx, Math.abs(d)); }
  const mse = se / (3 * n);
  return { psnr: mse ? 10 * Math.log10(255 * 255 / mse) : Infinity, maxDiff: mx };
}

window.run = async () => {
  const out = {};
  for (const mode of ["distance", "spline", "contour", "nearest"]) {
    const sc = scene(mode), f = 1.5, W = Math.round(sc.W0 * f), H = Math.round(sc.H0 * f);
    const cpu = S.renderCPU(sc, W, H);
    const b = S.sceneBuffers(sc);
    const t0 = performance.now();
    const gpuS = await renderGPU(S.storageShader(), [b.sp, b.labels, b.xf], S.sceneUniforms(sc, { x0: 0, y0: 0, scale: 1 / f }), W, H);
    const t1 = performance.now();
    const baked = S.bakeCollage(sc);
    const gpuB = await renderGPU(baked + VIEW, [], new Float32Array([0, 0, 1 / f, 0]), W, H);
    const t2 = performance.now();
    out[mode] = { storage_vs_cpu: compare(gpuS, cpu, W * H), baked_vs_cpu: compare(gpuB, cpu, W * H), baked_vs_storage: compare(gpuB, gpuS, W * H),
      storage_ms: t1 - t0, baked_ms: t2 - t1, bakedBytes: baked.length };
  }
  return out;
};
window.ready = true;
</script>
