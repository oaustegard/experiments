<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="180" viewBox="0 0 240 180">
  <style>.blue{fill:#2c7be5} .outline{stroke:#111;stroke-width:2} #big{opacity:.7}</style>
  <defs><path id="petal" d="M0 0 C 10 -20, 30 -20, 40 0 C 30 20, 10 20, 0 0 Z"/></defs>
  <rect width="240" height="180" fill="#fdf6e3"/>
  <g transform="translate(60 60)">
    <use xlink:href="#petal" fill="#e74c3c"/>
    <use xlink:href="#petal" fill="#e67e22" transform="rotate(72)"/>
    <use xlink:href="#petal" fill="#f1c40f" transform="rotate(144)"/>
    <use xlink:href="#petal" fill="#2ecc71" transform="rotate(216)"/>
    <use xlink:href="#petal" fill="#3498db" transform="rotate(288)"/>
  </g>
  <g transform="translate(170 50) skewX(20)"><rect x="-30" y="-25" width="60" height="50" class="blue outline"/></g>
  <g transform="translate(60 140) scale(2 0.6)"><circle r="20" fill="#9b59b6" stroke="#000" stroke-width="2"/></g>
  <g id="big" transform="matrix(0.866 0.5 -0.5 0.866 170 130)"><ellipse rx="40" ry="18" fill="#1abc9c" class="outline"/></g>
</svg>
