name: mona-lisa-typing render

# One-off: the session that made this experiment could not push binaries, so the
# runner assembles the script from its parts, renders the PNG and commits both.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System libraries for pycairo
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libcairo2-dev pkg-config fonts-dejavu-core
      - name: Python packages, pinned to the session's versions
        run: pip install pycairo==1.29.1 numpy==2.4.4 scipy==1.17.1
      - name: Assemble the script
        working-directory: mona-lisa-typing
        run: |
          if [ -d _parts ]; then
            cat _parts/part1.txt _parts/part2.txt _parts/part3.txt _parts/part4.txt > mona_lisa_typing.py
            git rm -rq _parts
          fi
          sha256sum mona_lisa_typing.py
          echo "expected e5d413913d2828a3e5bd5be822dbf6fd4e88e8920dd9945135af33dbf2cda8bf"
      - name: Render
        working-directory: mona-lisa-typing
        run: |
          python3 mona_lisa_typing.py
          sha256sum mona_lisa_typing.png
          echo "session render ddb3eeb9e8e68f11ddebcc0a245d7fa5882d5149fc57e9568a6e77bcde0a8f0c"
      - name: Index row and notes in the root README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          if "(mona-lisa-typing/README.md)" not in s:
              row = r'''| [`mona-lisa-typing/`](mona-lisa-typing/README.md) | 2026-09-25 | **done — the Mona Lisa typing on a laptop, drawn entirely in pycairo + numpy at the reference scan's 960×1431: a lit height-field face under ~60 glazes, sphere-swept z-buffered hands and satin sleeves, a laptop in real 3D with a ray-cast screen, Voronoi craquelure and yellowed varnish. Checked against the Wikimedia scan with luminance heat maps (face mean abs diff 19 → 14 of 255) and an independent critic subagent; the image is `mona_lisa_typing.png`** | [`README.md`](mona-lisa-typing/README.md) + `mona_lisa_typing.py` + [`mona_lisa_typing.png`](mona-lisa-typing/mona_lisa_typing.png) | Oskar: *"Iteratively, checking your results as you go, generate as high fidelity as you can muster, a pyCairo version of Mona Lisa typing on a laptop. Be creative and critical of your own work."* |'''
              notes = "\n\n".join([
                  r"""### `mona-lisa-typing/` — Leonardo's sitter at a keyboard, in pycairo""",
                  r"""Everything is procedural; the Wikimedia scan was used only to place landmarks and to measure colour and luminance. Most face corrections came from luminance heat maps (blurred render minus blurred reference): five rounds took the face's mean absolute difference from 19 to 14 levels. Glazes alone left the face flat; a local-contrast pass over a lit height field supplied the modelling. A flat sheet of small spheres for the palm showed a quilted pattern through any normal smoothing; larger spheres plus a heavier normal blur for the palm alone removed it. The critic subagent found three things I had stopped seeing: sleeves about twice the reference's brightness, surface texture 4–10× weaker than the panel's, and a laptop that read as a cool vector drawing.""",
                  r"""Wikimedia serves thumbnails only at standard widths (960 px worked, 800 px returned 400) and answers 429 to full-size downloads without a descriptive User-Agent.""",
              ]) + "\n\n"
              sep = "|---|---|---|---|---|\n"
              hdr = "## Per-experiment notes\n\n"
              assert sep in s and hdr in s
              s = s.replace(sep, sep + row + "\n", 1)
              s = s.replace(hdr, hdr + notes, 1)
              p.write_text(s)
              print("index row and notes added")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mona-lisa-typing README.md
          git commit -m "mona-lisa-typing: assemble script, render PNG on the runner, index row"
          git pull --rebase -q origin main
          git push origin HEAD:main
